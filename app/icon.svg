<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="45%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4F46E5" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring Highlight -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="white" stroke-width="4" stroke-opacity="0.15" />

  <!-- Background Decorative Glass Arc -->
  <circle cx="256" cy="270" r="145" fill="white" fill-opacity="0.06" />

  <!-- Center Floating Golden Coin with Heart Spark -->
  <g filter="url(#shadow)">
    <!-- Top Coin Entering Slot -->
    <circle cx="256" cy="148" r="44" fill="url(#accentGrad)" />
    <circle cx="256" cy="148" r="34" fill="none" stroke="#FDE68A" stroke-width="3.5" />
    <!-- Coin Sparkle / Star in Center of Coin -->
    <path d="M256 130L260 144L274 148L260 152L256 166L252 152L238 148L252 144Z" fill="#FFFBEB" />

    <!-- Main Body: Interlocking Piggy / Heart Wallet -->
    <path d="M160 216 C120 256, 120 330, 172 376 C214 412, 298 412, 340 376 C392 330, 392 256, 352 216 C326 190, 286 182, 256 182 C226 182, 186 190, 160 216 Z" 
          fill="white" 
          fill-opacity="0.95" />

    <!-- Coin Slot at the Top of the Body -->
    <rect x="226" y="200" width="60" height="12" rx="6" fill="#6366F1" />

    <!-- Two Hands Shaking / Heart Form inside Body -->
    <path d="M210 270 C210 250, 235 242, 256 262 C277 242, 302 250, 302 270 C302 296, 256 324, 256 324 C256 324, 210 296, 210 270 Z" 
          fill="url(#bgGrad)" />

    <!-- Cheerful eye/sparkle on left -->
    <circle cx="184" cy="254" r="7" fill="#7C3AED" />
  </g>
</svg>